# The native build (the decompiled game + libultraship + Torch) is the long pole here, so give
# the daemon room and let Gradle overlap the per-ABI CMake invocations.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Parallel Gradle sync (Gradle 9.4+).
org.gradle.tooling.parallel=true

# ── A note on the Gradle and AGP versions ─────────────────────────────────────────────────────
# Gradle 9.7.1 (gradle/wrapper) with AGP 9.3.2 (build.gradle.kts). They move together:
#
#   * Gradle 8.x cannot run on a JDK newer than 24, and current Android Studio bundles 25 — on
#     8.13 a build using Studio's JDK fails with an error whose entire text is the version number.
#   * AGP 8.x cannot run on Gradle 9.6+, which removed the internal API it uses
#     (org.gradle.api.problems.internal.InternalProblems).
#
# So AGP 8.x + Gradle 9.5.x and AGP 9.x + Gradle 9.6+ are the two coherent pairs. This project
# takes the second one; downgrading either half means downgrading both.
