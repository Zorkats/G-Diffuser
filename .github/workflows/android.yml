name: Android

# Android on its own, so a device test does not wait on the desktop release jobs.
# Runs on demand, and on pushes that touch something the APK actually contains.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'port/**'
      - 'cmake/**'
      - 'shaders/**'
      - 'tools/gen_f3d_o2r.py'
      - 'tools/gen_dump_tables_data.py'
      - 'CMakeLists.txt'
      - 'libultraship'
      - 'decomp'
      - 'torch'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history so the submodule gitlinks resolve.
          fetch-depth: 0

      # 21 rather than the 17 AGP floors at: that is what this Gradle/AGP pair has actually been
      # built and run on here, alongside the 25 Android Studio ships.
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        # Versions match android/app/build.gradle.kts. The NDK-bundled CMake is 3.22, which is
        # older than the 3.26 libultraship requires, hence the explicit cmake package.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "cmake;3.30.3" "ndk;30.0.15729638" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # Both the engine archive and the Expansion Kit compile assets are generated by Python
      # during the build -- the first by the Gradle task that packs the APK's assets, the second
      # by a custom target in port/CMakeLists.txt.
      - name: Install Python dependencies
        run: pip install pyyaml pillow

      # Debug-signed and debuggable, which is what you want for sideloading a test build.
      - name: Build debug APK
        run: android/gradlew -p android assembleDebug

      - name: Check the APK carries its game data
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK" || { echo "ERROR: APK not found"; exit 1; }

          # Every asset GameAssets.kt opens by name, plus the library SDLActivity dlopens. An
          # APK missing any of them installs and launches fine, then fails on device during
          # staging -- so it is checked here instead. Both ways of losing one leave CI green and
          # the APK unusable: an asset merge that never waited for the task filling its
          # directory, and a source file .gitignore swallowed.
          for entry in assets/gamedata.zip assets/gamedata.version assets/gamecontrollerdb.txt \
                       lib/arm64-v8a/libmain.so lib/arm64-v8a/libSDL2.so; do
            unzip -Z1 "$APK" | grep -qx "$entry" || { echo "ERROR: $entry missing from the APK"; exit 1; }
          done

          # And that the zip really holds the three things the game cannot start without: the
          # engine archive, the recipe config Torch keys its extraction off, and the US rev0
          # recipe tree it selects by ROM hash.
          unzip -p "$APK" assets/gamedata.zip > /tmp/gamedata.zip
          for entry in gdiffuser.o2r decomp-recipes/config.yml; do
            unzip -Z1 /tmp/gamedata.zip | grep -qx "$entry" || { echo "ERROR: $entry missing from gamedata.zip"; exit 1; }
          done
          unzip -Z1 /tmp/gamedata.zip | grep -q '^decomp-recipes/assets/yaml/us/rev0/' \
            || { echo "ERROR: the us/rev0 recipe tree is missing from gamedata.zip"; exit 1; }

          cp "$APK" G-Diffuser-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: G-Diffuser-debug-apk
          path: G-Diffuser-debug.apk
