name: Android

# Android on its own, so a device test does not wait on the desktop release jobs.
# Runs on demand, and on pushes that touch something the APK actually contains; both of those
# build the debug APK. nightly.yml calls it with a version instead, which builds the release APK
# signed with the project keystore, so each nightly installs over the last one.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version for the APK name, without the leading v'
        required: true
        type: string
    # Optional here so a missing one reaches the decode step, which says which secret to add.
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'port/**'
      - 'cmake/**'
      - 'shaders/**'
      - 'tools/gen_f3d_o2r.py'
      - 'tools/gen_dump_tables_data.py'
      - 'CMakeLists.txt'
      - 'libultraship'
      - 'decomp'
      - 'torch'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  # Separate groups, so a push to main does not cancel the nightly's release build.
  group: android-${{ inputs.version && 'release' || 'debug' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history so the submodule gitlinks resolve.
          fetch-depth: 0

      # 21 rather than the 17 AGP floors at: that is what this Gradle/AGP pair has actually been
      # built and run on here, alongside the 25 Android Studio ships.
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        # Versions match android/app/build.gradle.kts. The NDK-bundled CMake is 3.22, which is
        # older than the 3.26 libultraship requires, hence the explicit cmake package.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "cmake;3.30.3" "ndk;30.0.15729638" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # Both the engine archive and the Expansion Kit compile assets are generated by Python
      # during the build -- the first by the Gradle task that packs the APK's assets, the second
      # by a custom target in port/CMakeLists.txt.
      - name: Install Python dependencies
        run: pip install pyyaml pillow

      # Debug-signed and debuggable, which is what you want for sideloading a test build.
      - name: Build debug APK
        if: ${{ !inputs.version }}
        run: android/gradlew -p android assembleDebug

      # A release build without the keystore silently falls back to the debug key
      # (build.gradle.kts), and a nightly signed that way could never be updated by one signed
      # properly. So a missing secret fails the job instead.
      - name: Decode the release keystore
        if: ${{ inputs.version }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to sign a release with the debug key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gdiffuser.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/gdiffuser.jks" >> "$GITHUB_ENV"

      # Native code is Release in both variants; this one is not debuggable and is signed with
      # the project key.
      - name: Build release APK
        if: ${{ inputs.version }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: android/gradlew -p android assembleRelease

      - name: Check the APK carries its game data
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            APK=android/app/build/outputs/apk/release/app-release.apk
            OUT="G-Diffuser-v$VERSION-android-arm64.apk"
          else
            APK=android/app/build/outputs/apk/debug/app-debug.apk
            OUT=G-Diffuser-debug.apk
          fi
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ls -la "$APK" || { echo "ERROR: APK not found"; exit 1; }

          # Every asset GameAssets.kt opens by name, plus the library SDLActivity dlopens. An
          # APK missing any of them installs and launches fine, then fails on device during
          # staging -- so it is checked here instead. Both ways of losing one leave CI green and
          # the APK unusable: an asset merge that never waited for the task filling its
          # directory, and a source file .gitignore swallowed.
          for entry in assets/gamedata.zip assets/gamedata.version assets/gamecontrollerdb.txt \
                       lib/arm64-v8a/libmain.so lib/arm64-v8a/libSDL2.so; do
            unzip -Z1 "$APK" | grep -qx "$entry" || { echo "ERROR: $entry missing from the APK"; exit 1; }
          done

          # And that the zip really holds the three things the game cannot start without: the
          # engine archive, the recipe config Torch keys its extraction off, and the US rev0
          # recipe tree it selects by ROM hash.
          unzip -p "$APK" assets/gamedata.zip > /tmp/gamedata.zip
          for entry in gdiffuser.o2r decomp-recipes/config.yml; do
            unzip -Z1 /tmp/gamedata.zip | grep -qx "$entry" || { echo "ERROR: $entry missing from gamedata.zip"; exit 1; }
          done
          unzip -Z1 /tmp/gamedata.zip | grep -q '^decomp-recipes/assets/yaml/us/rev0/' \
            || { echo "ERROR: the us/rev0 recipe tree is missing from gamedata.zip"; exit 1; }

          cp "$APK" "$OUT"

      # The release name matches nightly.yml's G-Diffuser-v<version>-* download pattern.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.version && format('G-Diffuser-v{0}-android-arm64', inputs.version) || 'G-Diffuser-debug-apk' }}
          path: ${{ env.OUT }}
