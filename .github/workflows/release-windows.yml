name: Release (Windows)

# Builds the Windows release zip and proves the executables are self-contained before anyone
# can download them. Windows has two build trees whose outputs look identical in a file listing
# but are not interchangeable: the static one links its dependencies in, the dynamic one leaves
# eight DLLs that the archive does not carry. v1.0.0 was packaged from the wrong one and caught
# by hand; tools/check_windows_deps.py now reads the import table instead of trusting memory.
#
# Kept separate from the Linux workflow so one platform failing never blocks the other. The zip
# is published as a workflow artifact; attaching it to a release stays a manual step.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the zip name, without the leading v'
        required: true
        default: '0.0.0-test'

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # Pinned rather than windows-latest, which moves between images: the toolchain that builds a
    # release should change when we decide it does, not when the runner pool rolls over.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        # CMake checks for the interpreter but cannot check for modules, so a missing one would
        # otherwise surface mid-build as a ModuleNotFoundError.
        run: python -m pip install --disable-pip-version-check pyyaml pillow

      - name: Cache vcpkg
        # libultraship bootstraps its own vcpkg and builds every dependency from source, which
        # dominates a cold run. Keyed on the package list, so it only rebuilds when that changes.
        uses: actions/cache@v4
        with:
          path: build/x64/libultraship/vcpkg
          key: vcpkg-windows-2022-${{ hashFiles('libultraship/cmake/dependencies/windows-vcpkg.cmake') }}
          restore-keys: vcpkg-windows-2022-

      - name: Build
        # USE_AUTO_VCPKG lets libultraship bootstrap vcpkg into the build tree. --config Release
        # is required: the Visual Studio generator is multi-config and ignores CMAKE_BUILD_TYPE.
        #
        # Python3_EXECUTABLE is pinned to the interpreter pip installed into. The runner image
        # carries several in its tool cache, and FindPython3 otherwise takes the highest version it
        # can see -- which has none of the modules, so the build gets all the way to a linked
        # executable before a POST_BUILD generator dies on ModuleNotFoundError. setup-python
        # exports Python3_ROOT_DIR, but CMake reads that as a CMake variable, not an env one.
        run: |
          cmake -S . -B build/x64 -DUSE_AUTO_VCPKG=ON "-DPython3_EXECUTABLE=$env:pythonLocation\python.exe"
          cmake --build build/x64 --config Release --target G-Diffuser

      - name: Resolve version
        id: version
        # Through the environment rather than inline, so the dispatch input cannot be read as
        # shell syntax.
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $value = $env:REQUESTED_VERSION
          if (-not $value) { $value = "$env:GITHUB_REF_NAME" -replace '^v', '' }
          "value=$value" >> $env:GITHUB_OUTPUT

      - name: Package and verify dependencies
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: pwsh tools/package_windows.ps1 -BuildDir build/x64 -Version $env:VERSION -OutDir dist

      - uses: actions/upload-artifact@v4
        with:
          name: G-Diffuser-v${{ steps.version.outputs.value }}-windows-x64
          path: dist/*.zip
          if-no-files-found: error
